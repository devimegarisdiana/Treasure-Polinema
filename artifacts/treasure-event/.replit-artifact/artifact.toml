kind = "web"
previewPath = "/"
title = "TREASURE 2026"
description = "Official event landing page for TREASURE 2026, a business competition hosted by the Accounting Department of Politeknik Negeri Malang in collaboration with Edugate."
version = "1.0.0"
id = "artifacts/treasure-event"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25306

[services.development]
run = "pnpm --filter @workspace/treasure-event run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/treasure-event", "run", "build" ]
serve = "static"
publicDir = "artifacts/treasure-event/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25306"
BASE_PATH = "/"
